<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Cellar</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="label"></div>
    </div>
    <div id="overlay">
      <div class="card">
        <h1>The Cellar</h1>
        <p>Click to enter</p>
        <ul>
          <li><b>WASD</b> move &middot; <b>Mouse</b> look &middot; <b>Click</b> interact</li>
          <li><b>R</b> reveal the room behind the mirror</li>
          <li><b>L</b> the Lord checks in</li>
          <li><b>T</b> roll the rug back / lay it down</li>
          <li><b>Esc</b> release the mouse</li>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
